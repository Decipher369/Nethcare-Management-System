# ============================================================
# Nethcare Management System — Docker Compose
# MySQL 8.0 database for local dev / deployment
# ============================================================
# Usage:
#   docker compose up -d        start MySQL
#   docker compose logs -f      follow logs
#   docker compose down         stop (keeps data volume)
#   docker compose down -v      stop + WIPE data
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: nethcare-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: nethcare
      MYSQL_USER: nethcare_user
      MYSQL_PASSWORD: nethcare_pass
    volumes:
      - nethcare-mysql-data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --log_bin_trust_function_creators=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  nethcare-mysql-data:
    driver: local
