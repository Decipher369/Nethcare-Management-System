# ============================================================
# Production Configuration — override for deployment
# ============================================================

# Database — required in production. DB_URL must be a JDBC MySQL URL.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# JPA — validate schema in prod, don't auto-update
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Thymeleaf — enable cache in prod
spring.thymeleaf.cache=true

# Logging — less verbose in prod
logging.level.com.nethcare=INFO
logging.level.org.hibernate.SQL=WARN

# Opt-in bootstrap for the initial admin account. Disable after the first successful run.
seed.accounts.enabled=${SEED_ACCOUNTS_ENABLED:false}
seed.admin.password=${SEED_ADMIN_PASSWORD:}
