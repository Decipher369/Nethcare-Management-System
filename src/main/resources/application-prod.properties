# ============================================================
# Production Configuration — override for deployment
# ============================================================

server.port=8080

# Database — use environment variables in Docker
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nethcare?useSSL=true&serverTimezone=Asia/Colombo}
spring.datasource.username=${DB_USER:nethcare_user}
spring.datasource.password=${DB_PASS:nethcare_pass}

# JPA — validate schema in prod, don't auto-update
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Thymeleaf — enable cache in prod
spring.thymeleaf.cache=true

# Logging — less verbose in prod
logging.level.com.nethcare=INFO
logging.level.org.hibernate.SQL=WARN
