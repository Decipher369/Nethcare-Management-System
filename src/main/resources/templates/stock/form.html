<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{staff/fragments :: head('Stock item')}"></head>
<body>
<div th:replace="~{staff/fragments :: bar('stock', ${user})}"></div>

<div class="wrap">
    <h1 th:text="${item.id == null} ? 'Add a stock item' : 'Edit ' + ${item.itemCode}">Add a stock item</h1>

    <div class="panel" style="max-width:720px;">
        <p class="pad" role="alert" th:if="${error}" th:text="${error}" style="color:#9b1c1c;"></p>
        <form method="post" enctype="multipart/form-data"
              th:action="${item.id == null} ? @{/stock} : @{/stock/{id}(id=${item.id})}">
            <div class="pad">
                <div class="grid">
                    <div class="field">
                        <label for="itemCode">Item code</label>
                        <input id="itemCode" name="itemCode" required
                               th:value="${item.itemCode}" placeholder="TR-204">
                    </div>
                    <div class="field">
                        <label for="category">Category</label>
                        <select id="category" name="category" required>
                            <option th:each="c : ${categories}" th:value="${c}"
                                    th:text="${c.label}"
                                    th:selected="${item.category == c}">Frames</option>
                        </select>
                    </div>
                    <div class="field wide">
                        <label for="name">Name</label>
                        <input id="name" name="name" required
                               th:value="${item.name}" placeholder="Titan TR-204">
                    </div>
                    <div class="field">
                        <label for="brand">Brand</label>
                        <input id="brand" name="brand" th:value="${item.brand}">
                    </div>
                    <div class="field">
                        <label for="unitPrice">Unit price (LKR)</label>
                        <input id="unitPrice" name="unitPrice" type="number" step="0.01" min="0"
                               th:value="${item.unitPrice}">
                    </div>
                    <div class="field">
                        <label for="quantity">In stock</label>
                        <input id="quantity" name="quantity" type="number" min="0"
                               th:value="${item.quantity}">
                    </div>
                    <div class="field">
                        <label for="reorderLevel">Reorder at</label>
                        <input id="reorderLevel" name="reorderLevel" type="number" min="0"
                               th:value="${item.reorderLevel}">
                    </div>
                    <div class="field wide">
                        <label for="photo">Spectacle photo</label>
                        <input id="photo" name="photo" type="file" accept="image/jpeg,image/png"
                               aria-describedby="photo-help photo-error">
                        <p id="photo-help" class="note">Optional. Choose a JPEG or PNG up to 5 MB, at most 4096 × 4096 pixels.
                            Leave empty to keep the current photo.</p>
                        <p id="photo-error" role="alert" hidden style="color:#9b1c1c;"></p>
                        <img id="photo-preview" th:src="${item.imageUrl != null} ? @{${item.imageUrl}} : null"
                             th:style="${item.imageUrl != null} ? 'max-width:260px;max-height:180px;object-fit:contain;' : 'display:none;max-width:260px;max-height:180px;object-fit:contain;'"
                             alt="Stock photo preview">
                        <label th:if="${item.imageUrl != null}" style="display:block;margin-top:.7rem;">
                            <input id="removePhoto" type="checkbox" name="removePhoto" value="true"> Remove current photo
                        </label>
                    </div>
                    <div class="field wide">
                        <label for="description">Description</label>
                        <textarea id="description" name="description"
                                  th:text="${item.description}"></textarea>
                    </div>
                </div>

                <div style="margin-top:1.2rem;display:flex;gap:.6rem;">
                    <button class="btn" type="submit">Save</button>
                    <a class="btn ghost" th:href="@{/stock}">Cancel</a>
                </div>
            </div>
        </form>

        <div class="pad" th:if="${item.id != null}">
            <p class="note" style="margin:0;">
                To change the count, use the stock count page — it keeps the
                reserved units and records why the number moved.
                <a th:href="@{/stock/{id}/count(id=${item.id})}">Count this item</a>.
            </p>
        </div>
    </div>
</div>
<script th:src="@{/js/stock-photo.js}" defer></script>
</body>
</html>
