<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — Nethcare'">Nethcare</title>
    <link rel="icon" type="image/png" th:href="@{/images/nethcare-logo.png}">
    <link rel="stylesheet" th:href="@{/css/staff.css}">
</head>
<body>

<!-- ADMIN users get the shared administrator rail on every staff-facing page. -->
<th:block th:fragment="bar(active, user)">
    <th:block th:if="${currentRole == 'ADMIN'}">
        <div th:replace="~{admin/fragments :: bar(${active}, ${user})}"></div>
    </th:block>
    <th:block th:unless="${currentRole == 'ADMIN'}">
        <div th:replace="~{staff/fragments :: staffBar(${active}, ${user})}"></div>
    </th:block>
</th:block>

<div th:fragment="staffBar(active, user)" class="staff-layout">
    <aside class="app-side">
        <a class="app-brand" th:href="@{/dashboard}">
            <img th:src="@{/images/nethcare-logo.png}" alt="">
            <span><strong>Nethcare</strong><small>Management</small></span>
        </a>
        <nav aria-label="Main navigation">
            <span class="nav-group">Workspace</span>
            <a th:if="${currentRole == 'ADMIN' or currentRole == 'OPTICIAN' or currentRole == 'STAFF_NURSE' or currentRole == 'AUDITOR'}"
               th:href="@{/dashboard/console}" th:classappend="${active == 'dashboard'} ? ' on' : ''">Dashboard</a>
            <a th:if="${currentRole == 'ADMIN' or currentRole == 'OPTICIAN'}"
               th:href="@{/patients}" th:classappend="${active == 'patients'} ? ' on' : ''">Patients</a>
            <a th:if="${currentRole == 'ADMIN' or currentRole == 'OPTICIAN' or currentRole == 'SURGEON'}"
               th:href="@{/referrals}" th:classappend="${active == 'referrals'} ? ' on' : ''">Referrals</a>
            <a th:if="${currentRole == 'ADMIN' or currentRole == 'STAFF_NURSE'}"
               th:href="@{/stock}" th:classappend="${active == 'stock'} ? ' on' : ''">Stock</a>
            <a th:if="${currentRole == 'ADMIN' or currentRole == 'STAFF_NURSE'}"
               th:href="@{/orders}" th:classappend="${active == 'orders'} ? ' on' : ''">Orders</a>
            <a th:if="${currentRole == 'ADMIN' or currentRole == 'STAFF_NURSE'}"
               th:href="@{/bills}" th:classappend="${active == 'bills'} ? ' on' : ''">Bills</a>
            <div th:if="${currentRole == 'ADMIN' or currentRole == 'OPTICIAN'}">
                <span class="nav-group">Patient care</span>
                <a th:href="@{/followups}" th:classappend="${active == 'followups'} ? ' on' : ''">Follow-ups</a>
            </div>
            <div th:if="${currentRole == 'ADMIN' or currentRole == 'AUDITOR'}">
                <span class="nav-group">Reports</span>
                <a th:href="@{/reports/sales}" th:classappend="${active == 'sales'} ? ' on' : ''">Sales report</a>
                <a th:href="@{/reports/orders}" th:classappend="${active == 'report-orders'} ? ' on' : ''">Order report</a>
                <a th:href="@{/reports/stock}" th:classappend="${active == 'report-stock'} ? ' on' : ''">Stock report</a>
                <a th:href="@{/audit}" th:classappend="${active == 'audit'} ? ' on' : ''">Audit trail</a>
            </div>
            <div th:if="${currentRole == 'ADMIN'}">
                <span class="nav-group">Administration</span>
                <a th:href="@{/admin/users}" th:classappend="${active == 'admin'} ? ' on' : ''">Users</a>
            </div>
        </nav>
        <a class="public-link" th:href="@{/frames}">View public frames page ↗</a>
    </aside>
    <header class="topbar">
        <div class="topbar-context"><span class="context-mark"></span><span>Management workspace</span></div>
        <div class="topbar-account">
            <span class="who" th:text="${user}">staff</span>
            <form th:action="@{/logout}" method="post"><button type="submit" class="signout">Sign out</button></form>
        </div>
    </header>
    <div class="wrap">
        <div th:if="${msg}" class="flash" th:text="${msg}">Saved</div>
    </div>
</div>

</body>
</html>
