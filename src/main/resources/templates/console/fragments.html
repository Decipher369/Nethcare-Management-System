<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — Nethcare'">Nethcare</title>
    <link rel="icon" type="image/png" th:href="@{/images/nethcare-logo.png}">
    <link rel="stylesheet" th:href="@{/css/console.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<!-- The left rail. "active" is the key of the current screen. -->
<th:block th:fragment="side(active)">
<th:block th:if="${role == 'ADMIN'}">
    <aside th:replace="~{admin/fragments :: rail(${active})}"></aside>
</th:block>
<aside class="side" th:unless="${role == 'ADMIN'}">
    <div class="brand">
        <img th:src="@{/images/nethcare-logo.png}" alt="Nethcare logo">
        <span class="brand-copy">
            <strong>Nethcare</strong>
            <span>Neth Opticians</span>
        </span>
    </div>
    <nav>
        <a th:href="@{/dashboard/console}" th:classappend="${active == 'dashboard'} ? ' on' : ''">Dashboard</a>

        <div th:if="${role == 'ADMIN' or role == 'OPTICIAN'}">
            <div class="grp">Patient care</div>
            <a th:href="@{/patients}">Patients</a>
            <a th:href="@{/referrals}">Referrals</a>
            <a th:href="@{/followups}" th:classappend="${active == 'followups'} ? ' on' : ''">Review list</a>
            <a th:href="@{/notifications}" th:classappend="${active == 'notifications'} ? ' on' : ''">
                <span aria-hidden="true" style="display:inline-flex; align-items:center; vertical-align:middle; margin-right:6px;">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </span>Notifications
            </a>
        </div>

        <div th:if="${role == 'ADMIN' or role == 'STAFF_NURSE'}">
            <div class="grp">Store operations</div>
            <a th:href="@{/stock}">Stock</a>
            <a th:href="@{/orders}">Orders</a>
            <a th:href="@{/bills}">Bills</a>
        </div>

        <div th:if="${role == 'ADMIN' or role == 'AUDITOR'}">
            <div class="grp">Reports</div>
            <a th:href="@{/reports/sales}" th:classappend="${active == 'sales'} ? ' on' : ''">Sales</a>
            <a th:href="@{/reports/orders}" th:classappend="${active == 'report-orders'} ? ' on' : ''">Orders</a>
            <a th:href="@{/reports/stock}" th:classappend="${active == 'report-stock'} ? ' on' : ''">Stock</a>

            <div class="grp">Accountability</div>
            <a th:href="@{/audit}" th:classappend="${active == 'audit'} ? ' on' : ''">Audit trail</a>
        </div>
        <div th:if="${role == 'ADMIN'}">
            <div class="grp">Administration</div>
            <a th:href="@{/admin/users}">Users and login history</a>
        </div>
    </nav>
    <div class="out"><form th:action="@{/logout}" method="post"><button type="submit">Sign out</button></form></div>
</aside>
</th:block>

<!-- Screen title on the left, who is signed in on the right. -->
<div class="top" th:fragment="top(title, user, role)">
    <h1 th:text="${title}">Screen</h1>
    <div class="who">
        <span th:text="${user}">user</span>
        <span class="tag info" th:text="${role}">ROLE</span>
    </div>
    <form th:action="@{/logout}" method="post"><button class="console-signout" type="submit">Sign out</button></form>
</div>

<!-- Shown on every screen until the other modules are merged. -->
<div class="mock" th:fragment="mocknote" th:if="${mock}">
    Showing sample figures.
</div>

</body>
</html>
