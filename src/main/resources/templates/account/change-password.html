<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change password | NethCare</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
<main class="auth-shell">
    <section class="auth-card">
        <img th:src="@{/images/nethcare-logo.png}" alt="NethCare" class="auth-logo">
        <h1>Choose a new password</h1>
        <p>Your temporary password must be replaced before you continue.</p>
        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
        <form th:action="@{/account/change-password}" method="post">
            <label>Current password<input type="password" name="currentPassword" required autocomplete="current-password"></label>
            <label>New password<input type="password" name="newPassword" required minlength="12" autocomplete="new-password"></label>
            <small>Use at least 12 characters with a letter and a number.</small>
            <label>Confirm new password<input type="password" name="confirmPassword" required minlength="12" autocomplete="new-password"></label>
            <button type="submit" class="btn btn-primary">Change password</button>
        </form>
    </section>
</main>
</body>
</html>
