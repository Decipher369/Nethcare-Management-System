<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{clinical/fragments :: head('Referrals')}"></head>
<body>
<div th:replace="~{clinical/fragments :: bar('referrals', ${user})}"></div>
<main class="wrap">
    <h1 th:text="${surgeonView} ? 'My referral worklist' : 'Surgeon referrals'">Referrals</h1>
    <div class="flash" th:if="${msg}" th:text="${msg}">Saved</div>
    <div class="filters">
        <a class="tag" th:href="@{/referrals(status='PENDING')}">Pending</a>
        <a class="tag" th:href="@{/referrals(status='COMPLETED')}">Completed</a>
        <a class="tag" th:href="@{/referrals(status='all')}">All</a>
    </div>
    <p class="empty" th:if="${#lists.isEmpty(referrals)}">No referrals in this worklist.</p>
    <table class="panel" th:unless="${#lists.isEmpty(referrals)}">
        <thead><tr><th>Referral</th><th>Date</th><th>Patient</th><th>Surgeon</th><th>Urgency</th><th>Status</th><th>Reason</th></tr></thead>
        <tbody><tr th:each="r : ${referrals}">
            <td><a th:href="@{/referrals/{id}(id=${r.id})}" th:text="${r.refNo}">REF</a></td>
            <td th:text="${r.referredOn}">date</td>
            <td class="mono" th:text="${r.patientId}">patient</td>
            <td th:text="${r.surgeonName}">surgeon</td>
            <td><span class="tag" th:classappend="${r.urgency == 'URGENT'} ? ' bad' : ' info'" th:text="${r.urgency}">Routine</span></td>
            <td th:text="${r.status}">Pending</td>
            <td th:text="${r.reason}">reason</td>
        </tr></tbody>
    </table>
    <p class="note">Referral access does not expire. Completed cases remain in the clinical history.</p>
</main>
</body>
</html>
