<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — Nethcare'">Nethcare</title>
    <link rel="icon" type="image/png" th:href="@{/images/nethcare-logo.png}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="stylesheet" th:href="@{/css/landing.css}">
    <link rel="stylesheet" th:href="@{/css/glass-buttons.css}">
</head>
<body>

<!-- Nav: every public page, so it is written once. -->
<header class="site-head" th:fragment="nav(active)">
    <div class="wrap head-in">
        <a class="brand" th:href="@{/}">
            <img th:src="@{/images/nethcare-logo.png}" alt="Nethcare logo">
            <span class="brand-copy">
                <strong>Nethcare</strong>
                <span th:text="${biz.NAME}">Neth Opticians</span>
            </span>
        </a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="public-navigation" aria-label="Open navigation">
            <span class="menu-label">Menu</span><span class="menu-icon" aria-hidden="true"><i></i><i></i></span>
        </button>
        <div class="nav-panel" id="public-navigation">
        <nav aria-label="Main navigation">
            <a th:href="@{/}"      th:attr="aria-current=${active == 'home' ? 'page' : null}" th:classappend="${active == 'home'}    ? ' on' : ''">Home<span class="nav-arrow" aria-hidden="true">↗</span></a>
            <a th:href="@{/about}" th:attr="aria-current=${active == 'about' ? 'page' : null}" th:classappend="${active == 'about'}   ? ' on' : ''">About<span class="nav-arrow" aria-hidden="true">↗</span></a>
            <a th:href="@{/frames}" th:attr="aria-current=${active == 'frames' ? 'page' : null}" th:classappend="${active == 'frames'}  ? ' on' : ''">Frames<span class="nav-arrow" aria-hidden="true">↗</span></a>
            <a th:href="@{/contact}" th:attr="aria-current=${active == 'contact' ? 'page' : null}" th:classappend="${active == 'contact'} ? ' on' : ''">Contact<span class="nav-arrow" aria-hidden="true">↗</span></a>
        </nav>
        <div class="nav-actions"><a class="staff" th:href="@{/login}">Login</a><a class="nav-visit" th:href="@{/contact}">Visit us <span aria-hidden="true">↗</span></a></div>
        </div>
    </div>
    <script th:src="@{/js/public-navigation.js}" defer></script>
</header>

<footer class="site-foot" th:fragment="foot">
    <div class="wrap foot-in">
        <p>
            <strong th:text="${biz.NAME}">Neth Opticians</strong> ·
            <span th:text="${biz.LOCATION}">Kolonnawa</span>
        </p>
        <p class="fine">
            Eye examinations, prescription eyewear and contact lenses.
            <a th:href="@{/login}">Login</a>
        </p>
    </div>
</footer>


<th:block th:fragment="products(items)"><th:block th:each="i : ${items}"><article th:replace="~{public/fragments :: product(${i})}"></article></th:block></th:block>
            <article class="product-card" th:fragment="product(i)">
                <div class="product-image">
                    <span class="availability" th:text="${i.available() > 0 ? 'Available' : 'On order'}">Available</span>
                    <img th:if="${i.imageName != null and !i.imageName.isBlank()}" th:src="@{'/images/frames/' + ${i.imageName}}" th:alt="${i.name}" loading="lazy">
                    <div class="product-placeholder" th:if="${i.imageName == null or i.imageName.isBlank()}"><svg viewBox="0 0 100 60" fill="none" aria-hidden="true"><path d="M8 30S25 9 50 9s42 21 42 21-17 21-42 21S8 30 8 30Z"/><circle cx="50" cy="30" r="13"/></svg><span>Photo coming soon</span></div>
                </div>
                <div class="product-info"><p class="product-category" th:text="${i.category.label()}">Frames</p><h3 th:text="${i.name}">Frame</h3><p class="product-brand" th:if="${i.brand != null and !i.brand.isBlank()}" th:text="${i.brand}">Brand</p><p class="product-description" th:if="${i.description != null and !i.description.isBlank()}" th:text="${i.description}">Description</p><div class="product-bottom"><span>LKR <strong th:text="${#numbers.formatDecimal(i.unitPrice, 1, 'COMMA', 2, 'POINT')}">0.00</strong></span><span class="product-code" th:text="${i.itemCode}">CODE</span></div></div>
            </article>
</body>
</html>
