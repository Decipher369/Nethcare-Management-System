<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('User administration')}"></head>
<body>
<div th:replace="~{admin/fragments :: bar('users', ${currentUser})}"></div>

<main class="wrap admin-content">
    <h1>User administration</h1>
    <p class="ok" th:if="${success}" th:text="${success}"></p>
    <p class="err" th:if="${error}" th:text="${error}"></p>
    <div class="credential" th:if="${credential}"><strong>Show once:</strong> username <code th:text="${credential.username}"></code>, temporary password <code th:text="${credential.temporaryPassword}"></code></div>

    <section class="card">
        <h2>Create staff account</h2>
        <form th:action="@{/admin/users}" method="post" class="grid">
            <input name="username" placeholder="Username" required>
            <input name="fullName" placeholder="Full name" required>
            <input name="email" type="email" placeholder="Email">
            <input name="phone" placeholder="Phone">
            <input name="password" type="password" minlength="12" placeholder="Temporary password" required>
            <select name="role" required><option value="">Role</option><option th:each="r:${roles}" th:value="${r}" th:text="${r}"></option></select>
            <button type="submit">Create account</button>
        </form>
    </section>

    <section class="card">
        <h2>Accounts</h2>
        <table>
            <thead><tr><th>User</th><th>Name</th><th>Role</th><th>Status</th><th>Last login</th><th>Actions</th></tr></thead>
            <tbody><tr th:each="u:${users}">
                <td th:text="${u.username}"></td><td th:text="${u.fullName}"></td>
                <td><form class="inline" th:if="${u.role.name() != 'PATIENT'}" th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post"><select name="role"><option th:each="r:${roles}" th:value="${r}" th:text="${r}" th:selected="${r == u.role}"></option></select><button>Save</button></form><span th:if="${u.role.name() == 'PATIENT'}">PATIENT</span></td>
                <td th:text="${u.active ? 'Active' : 'Inactive'}"></td><td th:text="${u.lastLoginAt} ?: 'Never'"></td>
                <td><form class="inline" th:action="@{/admin/users/{id}/reset-password(id=${u.id})}" method="post"><button>Reset password</button></form><form class="inline" th:if="${u.active}" th:action="@{/admin/users/{id}/deactivate(id=${u.id})}" method="post"><button>Deactivate</button></form><form class="inline" th:unless="${u.active}" th:action="@{/admin/users/{id}/reactivate(id=${u.id})}" method="post"><button>Reactivate</button></form></td>
            </tr></tbody>
        </table>
    </section>

    <section class="card">
        <h2>Recent login activity</h2>
        <table><thead><tr><th>Time</th><th>Username</th><th>Result</th><th>IP</th><th>Reason</th></tr></thead>
            <tbody><tr th:each="e:${loginEvents}"><td th:text="${e.occurredAt}"></td><td th:text="${e.username}"></td><td th:text="${e.successful ? 'Success' : 'Failed'}"></td><td th:text="${e.ipAddress}"></td><td th:text="${e.failureReason} ?: '—'"></td></tr></tbody>
        </table>
    </section>
</main>
</body>
</html>
