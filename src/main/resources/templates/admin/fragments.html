<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — Nethcare'">Nethcare administration</title>
    <link rel="icon" type="image/png" th:href="@{/images/nethcare-logo.png}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<!-- Shared navigation for every administrator screen. Keep new admin pages on this fragment. -->
<div th:fragment="bar(active, user)" class="admin-shell">
    <aside class="admin-nav" th:fragment="rail(active)" aria-label="Administration navigation">
        <a class="admin-brand" th:href="@{/dashboard/console}">
            <img th:src="@{/images/nethcare-logo.png}" alt="">
            <span><strong>Nethcare</strong><small>Administration</small></span>
        </a>

        <nav>
            <span class="admin-nav-group">Workspace</span>
            <a th:href="@{/dashboard/console}"
               th:classappend="${active == 'dashboard'} ? ' active' : ''">
                <span aria-hidden="true" style="display:inline-flex; align-items:center; justify-content:center;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </span> Dashboard
            </a>

            <span class="admin-nav-group">People and care</span>
            <a th:href="@{/admin/users}"
               th:classappend="${active == 'users'} ? ' active' : ''">
                <span aria-hidden="true" style="display:inline-flex; align-items:center; justify-content:center;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                </span> Users and access
            </a>
            <a th:href="@{/patients}"
               th:classappend="${active == 'patients'} ? ' active' : ''">
                <span aria-hidden="true" style="display:inline-flex; align-items:center; justify-content:center;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </span> Patients
            </a>
            <a th:href="@{/referrals}"
               th:classappend="${active == 'referrals'} ? ' active' : ''">
                <span aria-hidden="true" style="display:inline-flex; align-items:center; justify-content:center;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="23" y1="11" x2="17" y2="11"></line>
                    </svg>
                </span> Referrals
            </a>
            <a th:href="@{/followups}"
               th:classappend="${active == 'followups'} ? ' active' : ''">
                <span aria-hidden="true" style="display:inline-flex; align-items:center; justify-content:center;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                </span> Follow-ups
            </a>
            <a th:href="@{/notifications}"
               th:classappend="${active == 'notifications'} ? ' active' : ''">
                <span aria-hidden="true" style="display:inline-flex; align-items:center; justify-content:center;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </span> Notifications
            </a>

            <span class="admin-nav-group">Store operations</span>
            <a th:href="@{/stock}" th:classappend="${active == 'stock'} ? ' active' : ''">
                <span aria-hidden="true" style="display:inline-flex; align-items:center; justify-content:center;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                </span> Stock
            </a>
            <a th:href="@{/orders}" th:classappend="${active == 'orders'} ? ' active' : ''">
                <span aria-hidden="true" style="display:inline-flex; align-items:center; justify-content:center;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                    </svg>
                </span> Orders
            </a>
            <a th:href="@{/bills}" th:classappend="${active == 'bills'} ? ' active' : ''">
                <span aria-hidden="true" style="display:inline-flex; align-items:center; justify-content:center;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                        <line x1="2" y1="10" x2="22" y2="10"></line>
                        <line x1="6" y1="15" x2="10" y2="15"></line>
                    </svg>
                </span> Bills
            </a>

            <span class="admin-nav-group">Reports and audit</span>
            <a th:href="@{/reports/sales}" th:classappend="${active == 'sales'} ? ' active' : ''">
                <span aria-hidden="true" style="display:inline-flex; align-items:center; justify-content:center;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                </span> Sales report
            </a>
            <a th:href="@{/reports/orders}" th:classappend="${active == 'report-orders'} ? ' active' : ''">
                <span aria-hidden="true" style="display:inline-flex; align-items:center; justify-content:center;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                </span> Order report
            </a>
            <a th:href="@{/reports/stock}" th:classappend="${active == 'report-stock'} ? ' active' : ''">
                <span aria-hidden="true" style="display:inline-flex; align-items:center; justify-content:center;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                </span> Stock report
            </a>
            <a th:href="@{/audit}" th:classappend="${active == 'audit'} ? ' active' : ''">
                <span aria-hidden="true" style="display:inline-flex; align-items:center; justify-content:center;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        <path d="m9 12 2 2 4-4"></path>
                    </svg>
                </span> Audit trail
            </a>
        </nav>

        <a class="admin-public-link" th:href="@{/frames}">View public frames page ↗</a>
    </aside>

    <header class="admin-topbar">
        <div>
            <span class="admin-eyebrow">Nethcare</span>
            <strong>Administration</strong>
        </div>
        <div class="admin-account">
            <span th:text="${user}">admin</span>
            <form th:action="@{/logout}" method="post">
                <button type="submit">Sign out</button>
            </form>
        </div>
    </header>
    <div class="admin-flash" th:if="${msg}" th:text="${msg}">Saved</div>
</div>

</body>
</html>
