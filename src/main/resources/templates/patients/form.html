<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${editing} ? 'Edit patient — NethCare' : 'Register patient — NethCare'">Patient</title>
    <link rel="icon" type="image/png" th:href="@{/images/nethcare-logo.png}">
    <link rel="stylesheet" th:href="@{/css/staff.css}">
    <style>
        body { font-family: system-ui, sans-serif; background: #f5f6f8; margin: 0; padding: 2rem; }
        .wrap { max-width: 620px; margin: 0 auto; }
        .card { background: #fff; border-radius: 8px; padding: 2rem;
                box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        h1 { font-size: 1.4rem; margin: 0 0 1.5rem; color: #1a3a5c; }
        label { display: block; font-size: .78rem; color: #666;
                margin-bottom: .3rem; letter-spacing: .03em; }
        .field { margin-bottom: 1rem; }
        input[type=text], input[type=date], input[type=email] {
                width: 100%; padding: .55rem .7rem; font-size: .9rem;
                border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        textarea { width:100%; min-height:80px; box-sizing:border-box; padding:.55rem .7rem; border:1px solid #ddd; border-radius:4px; }
        .two { display: flex; gap: 1rem; }
        .two > .field { flex: 1; }
        .tick { display: flex; align-items: center; gap: .5rem; font-size: .88rem;
                color: #333; margin-bottom: 1.25rem; }
        .actions { display: flex; gap: .6rem; margin-top: 1.5rem; }
        .actions button, .actions a { padding: .6rem 1.2rem; font-size: .9rem;
                border-radius: 4px; cursor: pointer; text-decoration: none; }
        .actions button { background: #1a3a5c; color: #fff; border: none; }
        .actions a { background: #f0f0f0; color: #333; }
        .err { background: #fdeaea; color: #a33; padding: .7rem .9rem;
               border-radius: 4px; font-size: .87rem; margin-bottom: 1.2rem; }
    </style>
</head>
<body>
<div th:replace="~{staff/fragments :: bar('patients', ${currentUser})}"></div>
<div class="wrap">
    <div class="card">
        <h1 th:text="${editing} ? 'Edit patient' : 'Register a patient'">Register a patient</h1>

        <p class="err" th:if="${error}" th:text="${error}">Something went wrong.</p>

        <form method="post" th:action="${editing} ? @{/patients/{id}(id=${patient.id})} : @{/patients}">
            <div class="field">
                <label for="fullName">Full name</label>
                <input type="text" id="fullName" name="fullName" th:value="${form.fullName}">
            </div>

            <div class="field">
                <label for="nic">NIC (required for adults)</label>
                <input type="text" id="nic" name="nic" th:value="${form.nic}">
            </div>

            <div class="two">
                <div class="field">
                    <label for="dob">Date of birth</label>
                    <input type="date" id="dob" name="dob" th:value="${form.dob}">
                </div>
                <div class="field">
                    <label for="gender">Gender</label>
                    <input type="text" id="gender" name="gender" th:value="${form.gender}"
                           placeholder="F / M / other">
                </div>
            </div>

            <div class="two">
                <div class="field">
                    <label for="phone">Phone</label>
                    <input type="text" id="phone" name="phone" th:value="${form.phone}">
                </div>
                <div class="field">
                    <label for="bloodGroup">Blood group</label>
                    <input type="text" id="bloodGroup" name="bloodGroup" th:value="${form.bloodGroup}"
                           placeholder="O+">
                </div>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" th:value="${form.email}">
            </div>

            <div class="field">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" th:value="${form.address}">
            </div>

            <div class="two">
                <div class="field"><label for="guardianName">Guardian name (required under 18)</label><input type="text" id="guardianName" name="guardianName" th:value="${form.guardianName}"></div>
                <div class="field"><label for="guardianPhone">Guardian phone</label><input type="text" id="guardianPhone" name="guardianPhone" th:value="${form.guardianPhone}"></div>
            </div>

            <div class="field"><label for="registrationNotes">Registration notes</label><textarea id="registrationNotes" name="registrationNotes" th:text="${form.registrationNotes}"></textarea></div>

            <label class="tick" th:unless="${editing}">
                <input type="checkbox" name="createLogin" value="true" th:checked="${form.createLogin}">
                Also create a login for the patient portal
            </label>

            <label class="tick" th:unless="${editing}">
                <input type="checkbox" name="consentGiven" value="true" required th:checked="${form.consentGiven}">
                Patient or guardian has consented to storing these records
            </label>

            <div class="actions">
                <button type="submit" th:text="${editing} ? 'Save changes' : 'Register'">Register</button>
                <a th:href="${editing} ? @{/patients/{id}(id=${patient.id})} : @{/patients}">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
