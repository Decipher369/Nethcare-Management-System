<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — Nethcare'">Nethcare</title>
    <link rel="icon" type="image/png" th:href="@{/images/nethcare-logo.png}">
    <link rel="stylesheet" th:href="@{/css/glass-buttons.css}">
    <style>
        :root {
            --paper: #fff9ed;
            --navy: #174c70;
            --brand-blue: #3d8fcb;
            --brand-deep: #236b9e;
            --ink-deep: #062236;
            --muted: #556e7b;
            --line: #d9e3e5;
        }
        * { box-sizing: border-box; }
        body {
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background-color: var(--paper);
            background-image:
                radial-gradient(ellipse 65% 50% at 50% -10%, rgba(61, 143, 203, 0.12) 0%, transparent 70%),
                radial-gradient(ellipse 45% 35% at 90% 85%, rgba(61, 143, 203, 0.08) 0%, transparent 60%);
            background-attachment: fixed;
            color: var(--ink-deep);
            margin: 0;
            padding: 3rem 1.5rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wrap { width: 100%; max-width: 580px; }
        .card {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 12px 40px rgba(23, 76, 112, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .card-brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            margin-bottom: 1.5rem;
        }
        .card-brand img { width: 32px; height: 32px; object-fit: contain; }
        .card-brand span {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.15rem;
            color: var(--navy);
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        h1 {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.85rem;
            font-weight: 400;
            margin: 0 0 .5rem;
            color: var(--navy);
            line-height: 1.25;
        }
        .role {
            display: inline-flex;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            background: rgba(61, 143, 203, 0.12);
            color: var(--navy);
            border: 1px solid rgba(61, 143, 203, 0.25);
            padding: .3rem .85rem;
            border-radius: 50px;
            margin-bottom: 1.75rem;
        }
        ul { list-style: none; padding: 0; margin: 0 0 1.5rem; }
        li {
            padding: .85rem 0;
            border-bottom: 1px solid rgba(217, 227, 229, 0.6);
            font-size: .95rem;
            color: var(--ink-deep);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        li::before {
            content: "•";
            color: var(--brand-blue);
            font-size: 1.2rem;
            line-height: 1;
        }
        li:last-child { border-bottom: none; }
        .note {
            margin: 1.5rem 0 1.75rem;
            font-size: .85rem;
            color: var(--muted);
            line-height: 1.5;
            background: rgba(255, 249, 237, 0.8);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 16px;
        }
        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-return {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 22px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            background: linear-gradient(135deg, rgba(129, 194, 238, 0.7), rgba(61, 143, 203, 0.5));
            color: var(--ink-deep);
            border: 1px solid rgba(61, 143, 203, 0.4);
            box-shadow: 0 2px 10px rgba(61, 143, 203, 0.18);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-return:hover {
            background: var(--brand-deep);
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(35, 107, 158, 0.28);
            border-color: var(--brand-deep);
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <a class="card-brand" th:href="@{/}">
            <img th:src="@{/images/nethcare-logo.png}" alt="Nethcare">
            <span>Nethcare</span>
        </a>
        <h1 th:text="${title}">Page</h1>
        <span class="role" th:text="${role}">ROLE</span>

        <ul>
            <li th:each="item : ${items}" th:text="${item}">item</li>
        </ul>

        <p class="note">
            Screens for this section are being prepared with our new editorial design system.
        </p>

        <div class="actions">
            <a class="btn-return" th:href="@{/dashboard}">
                ← Return to dashboard
            </a>
        </div>
    </div>
</div>
</body>
</html>
