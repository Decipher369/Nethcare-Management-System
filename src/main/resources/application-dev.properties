# Throwaway passwords for the seeded accounts, one per role.
# The seeder skips if the users table already has rows.
seed.admin.password=admin123
seed.optician.password=optician123
seed.staff.password=staff123
seed.surgeon.password=surgeon123
seed.patient.password=patient123

# Prints the account list on the login page. Set false to hide it.
seed.show-hint=true
