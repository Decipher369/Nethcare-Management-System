# ============================================================
# Nethcare Management System — Application Configuration
# ============================================================

server.port=8080
spring.application.name=Nethcare Management System

# ------------------------------------------------------------
# Database — MySQL
# ------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/nethcare?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true
spring.datasource.username=nethcare_user
spring.datasource.password=nethcare_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Versioned schema changes. Version 0 lets Flyway adopt an existing development
# database before applying the first M1 migration.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ------------------------------------------------------------
# Thymeleaf
# ------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ------------------------------------------------------------
# Security (override in application-prod.properties)
# ------------------------------------------------------------
# JWT / session settings will go here once auth is implemented

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging.level.com.nethcare=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ------------------------------------------------------------
# Nethcare business config
# ------------------------------------------------------------
nethcare.order.advance-percentage=40

# M4 notification dispatch. Production enables this and supplies gateway values.
nethcare.sms.enabled=false
nethcare.sms.dispatch-cron=0 0 8 * * *
