# ============================================================
# Nethcare Management System — Application Configuration
# ============================================================

server.port=8080
spring.application.name=Nethcare Management System

# ------------------------------------------------------------
# Database — MySQL
# ------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/nethcare?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true
spring.datasource.username=nethcare_user
spring.datasource.password=nethcare_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------
# Thymeleaf
# ------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ------------------------------------------------------------
# Security (override in application-prod.properties)
# ------------------------------------------------------------
# JWT / session settings will go here once auth is implemented

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging.level.com.nethcare=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ------------------------------------------------------------
# Nethcare business config
# ------------------------------------------------------------
nethcare.prescription.validity-months=12
nethcare.followup.regular-months=12
nethcare.followup.contact-lens-months=6
nethcare.order.advance-percentage=40
nethcare.surgeon.access-days=90
