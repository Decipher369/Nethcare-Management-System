# ============================================================
# Nethcare Management System — Application Configuration
# ============================================================

server.port=${PORT:8081}
spring.application.name=Nethcare Management System
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Load local environment / secrets if present (git-ignored, kept outside source control)
spring.config.import=optional:file:.env[.properties],optional:file:application-secrets.properties

# Seed account credentials (DataSeeder) — override via env vars in non-dev
seed.admin.password=${SEED_ADMIN_PASSWORD:admin123}
seed.optician.password=${SEED_OPTICIAN_PASSWORD:optician123}
seed.staff.password=${SEED_STAFF_PASSWORD:staff123}
seed.surgeon.password=${SEED_SURGEON_PASSWORD:surgeon123}
seed.patient.password=${SEED_PATIENT_PASSWORD:patient123}
seed.auditor.password=${SEED_AUDITOR_PASSWORD:auditor123}

# ------------------------------------------------------------
# Database — MySQL
# ------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/nethcare?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true&autoReconnect=true&tcpKeepAlive=true}
spring.datasource.username=${DB_USER:nethcare_user}
spring.datasource.password=${DB_PASS:nethcare_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings (prevents connection reset issues with XAMPP MySQL)
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=580000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000

# JPA / Hibernate validates mappings against the schema; Flyway owns all schema changes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Versioned schema changes. Version 0 lets Flyway adopt an existing development
# database before applying the first M1 migration.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ------------------------------------------------------------
# Thymeleaf
# ------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ------------------------------------------------------------
# Security (override in application-prod.properties)
# ------------------------------------------------------------
# JWT / session settings will go here once auth is implemented

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging.level.com.nethcare=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ------------------------------------------------------------
# Nethcare business config
# ------------------------------------------------------------
nethcare.order.advance-percentage=40

# M4 notification dispatch & SMS gateway configuration
nethcare.sms.enabled=true
nethcare.sms.provider=${SMS_PROVIDER:simulator}
nethcare.sms.max-retries=3
nethcare.sms.dispatch-cron=0 0 8 * * *

# Notify.lk SMS API configuration (used when nethcare.sms.provider=notifylk)
nethcare.sms.notifylk.endpoint=${NOTIFYLK_ENDPOINT:https://app.notify.lk/api/v1/send}
nethcare.sms.notifylk.user-id=${NOTIFYLK_USER_ID:}
nethcare.sms.notifylk.api-key=${NOTIFYLK_API_KEY:}
nethcare.sms.notifylk.sender-id=${NOTIFYLK_SENDER_ID:NotifyDEMO}

# M4 notification dispatch & Email gateway configuration
nethcare.email.enabled=true
nethcare.email.provider=${EMAIL_PROVIDER:simulator}
nethcare.email.smtp.from=${EMAIL_FROM:no-reply@nethcare.lk}

# Brevo Email API configuration (used when nethcare.email.provider=brevo)
nethcare.email.brevo.endpoint=${BREVO_ENDPOINT:https://api.brevo.com/v3/smtp/email}
nethcare.email.brevo.api-key=${BREVO_API_KEY:}
nethcare.email.brevo.sender-email=${BREVO_SENDER_EMAIL:no-reply@nethcare.lk}
nethcare.email.brevo.sender-name=${BREVO_SENDER_NAME:Nethcare Clinic}


# Stock photo uploads: persisted in MySQL, at most 5 MB per image.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
