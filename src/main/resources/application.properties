# ============================================================
# Nethcare Management System — Application Configuration
# ============================================================

server.port=${PORT:8081}
spring.application.name=Nethcare Management System
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Throwaway passwords for seeded accounts (DataSeeder)
seed.admin.password=admin123
seed.optician.password=optician123
seed.staff.password=staff123
seed.surgeon.password=surgeon123
seed.patient.password=patient123
seed.auditor.password=auditor123

# ------------------------------------------------------------
# Database — MySQL
# ------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/nethcare?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true&autoReconnect=true&tcpKeepAlive=true
spring.datasource.username=nethcare_user
spring.datasource.password=nethcare_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings (prevents connection reset issues with XAMPP MySQL)
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=580000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000

# JPA / Hibernate validates mappings against the schema; Flyway owns all schema changes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Versioned schema changes. Version 0 lets Flyway adopt an existing development
# database before applying the first M1 migration.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ------------------------------------------------------------
# Thymeleaf
# ------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ------------------------------------------------------------
# Security (override in application-prod.properties)
# ------------------------------------------------------------
# JWT / session settings will go here once auth is implemented

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging.level.com.nethcare=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ------------------------------------------------------------
# Nethcare business config
# ------------------------------------------------------------
nethcare.order.advance-percentage=40

# M4 notification dispatch & SMS gateway configuration
nethcare.sms.enabled=true
nethcare.sms.provider=${SMS_PROVIDER:simulator}
nethcare.sms.max-retries=3
nethcare.sms.dispatch-cron=0 0 8 * * *

# Notify.lk SMS API configuration (used when nethcare.sms.provider=notifylk)
nethcare.sms.notifylk.endpoint=${NOTIFYLK_ENDPOINT:https://app.notify.lk/api/v1/send}
nethcare.sms.notifylk.user-id=${NOTIFYLK_USER_ID:}
nethcare.sms.notifylk.api-key=${NOTIFYLK_API_KEY:}
nethcare.sms.notifylk.sender-id=${NOTIFYLK_SENDER_ID:NotifyDEMO}

